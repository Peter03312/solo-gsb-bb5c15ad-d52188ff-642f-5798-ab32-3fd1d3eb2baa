<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>矩形纸张贯通式裁切排样</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#d9dde3; --ink:#1f2733;
    --muted:#66707d; --brand:#23578a; --brand2:#e8f0f8;
    --ok:#1a7f4b; --okbg:#e6f5ec; --warn:#9a6200; --warnbg:#fdf2dd;
    --bad:#a52828; --badbg:#fbe9e9;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--brand);color:#fff;padding:14px 22px}
  header h1{margin:0;font-size:18px;font-weight:600}
  header .sub{opacity:.85;font-size:12px;margin-top:2px}
  main{max-width:1180px;margin:18px auto;padding:0 16px;
       display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
  @media (max-width:960px){ main{grid-template-columns:1fr} }
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;
        padding:16px 18px;margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:15px;border-left:3px solid var(--brand);
           padding-left:8px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
  input[type=number],input[type=text]{
    width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;
    font-size:14px;font-family:inherit}
  input:focus{outline:none;border-color:var(--brand)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 70px;gap:0 8px;align-items:end}
  table.prods{width:100%;border-collapse:collapse;margin-top:8px}
  table.prods th,table.prods td{padding:4px 4px;border-bottom:1px solid var(--line);
       font-size:12px;text-align:left}
  table.prods input{padding:5px 6px;font-size:12px}
  table.prods th{color:var(--muted);font-weight:500}
  .rot-cell{text-align:center}
  button{cursor:pointer;border:1px solid var(--brand);background:var(--brand);
         color:#fff;border-radius:5px;padding:8px 14px;font-size:13px;font-family:inherit}
  button.secondary{background:#fff;color:var(--brand)}
  button.ghost{background:#fff;color:var(--muted);border-color:var(--line)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .badge{display:inline-block;padding:2px 9px;border-radius:11px;font-size:12px;font-weight:600}
  .badge.found{background:var(--okbg);color:var(--ok)}
  .badge.budget{background:var(--warnbg);color:var(--warn)}
  .badge.infeasible{background:var(--badbg);color:var(--bad)}
  .badge.none{background:#eef0f3;color:var(--muted)}
  .banner{padding:9px 12px;border-radius:6px;margin:10px 0;font-size:13px;display:none}
  .banner.ok{background:var(--okbg);color:var(--ok)}
  .banner.warn{background:var(--warnbg);color:var(--warn)}
  .banner.bad{background:var(--badbg);color:var(--bad)}
  .meta{font-size:12px;color:var(--muted)}
  .stale-note{background:var(--badbg);color:var(--bad);padding:8px 12px;
              border-radius:6px;margin-bottom:10px;display:none}
  .sheet-block{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px}
  .sheet-block h3{margin:0 0 8px;font-size:14px}
  .sheet-wrap{overflow:auto}
  svg.paper{background:#fbfbf8;border:1px solid #888;display:block}
  .legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:8px 0;font-size:12px}
  .legend .sw{display:inline-block;width:12px;height:12px;border:1px solid #333;
              vertical-align:-2px;margin-right:4px}
  table.cuts{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
  table.cuts th,table.cuts td{border:1px solid var(--line);padding:4px 8px;text-align:center}
  table.cuts th{background:var(--brand2);font-weight:600}
  .counts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .counts .chip{background:var(--brand2);border-radius:14px;padding:3px 12px;font-size:12px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .errfield{border-color:var(--bad)!important}
</style>
</head>
<body>
<header>
  <h1>矩形纸张贯通式裁切排样</h1>
  <div class="sub">输入母纸与成品参数，搜索满足全部份数的 guillotine（每刀贯穿当前余料）排样方案</div>
</header>

<main>
  <!-- 左栏：输入 -->
  <section>
    <div class="card">
      <h2>母纸与搜索参数</h2>
      <div class="grid2">
        <div><label>母纸长 L（mm，正整数）</label>
          <input id="paper_l" type="number" min="1" step="1" value="300"></div>
        <div><label>母纸宽 W（mm，正整数）</label>
          <input id="paper_w" type="number" min="1" step="1" value="220"></div>
      </div>
      <div class="grid2">
        <div><label>刀缝宽度（mm，非负整数）</label>
          <input id="kerf" type="number" min="0" step="1" value="3"></div>
      </div>
      <div class="grid2">
        <div><label>张数上限（正整数）</label>
          <input id="max_sheets" type="number" min="1" step="1" value="6"></div>
        <div><label>搜索状态数上限（正整数）</label>
          <input id="max_states" type="number" min="1" step="1" value="100000"></div>
      </div>
    </div>

    <div class="card">
      <h2>成品清单</h2>
      <table class="prods">
        <thead><tr>
          <th>名称</th><th>长</th><th>宽</th><th>份数</th><th class="rot-cell">可旋转</th><th></th>
        </tr></thead>
        <tbody id="prod_rows"></tbody>
      </table>
      <div class="row">
        <button class="secondary" id="btn_add" type="button">+ 添加成品</button>
      </div>
      <div class="hint">尺寸单位毫米，均为正整数；份数为正整数；取消勾选「可旋转」后该成品只能按长×宽原方向放置。</div>
    </div>

    <div class="card">
      <div class="row">
        <button id="btn_save" type="button">保存输入</button>
        <button id="btn_solve" type="button" disabled>保存并排样</button>
        <button class="ghost" id="btn_export" type="button" disabled>导出裁切单</button>
      </div>
      <div id="form_msg" class="banner"></div>
      <div class="meta" id="save_meta">尚未保存输入</div>
    </div>
  </section>

  <!-- 右栏：结果 -->
  <section>
    <div class="card">
      <h2>排样结果</h2>
      <div id="stale_note" class="stale-note">
        ⚠ 当前输入在方案生成后被修改，旧方案已失效。请重新点击「保存并排样」。
      </div>
      <div class="row" style="margin-top:0">
        <span>状态：<span id="sol_badge" class="badge none">未排样</span></span>
        <span class="meta" id="sol_meta"></span>
      </div>
      <div id="sol_banner" class="banner"></div>
      <div id="summary"></div>
    </div>

    <div class="card" id="layout_card" style="display:none">
      <h2>逐张排样图</h2>
      <div class="legend" id="legend"></div>
      <div id="sheets"></div>
    </div>

    <div class="card" id="cuts_card" style="display:none">
      <h2>贯通式裁切步骤（按执行顺序）</h2>
      <div class="hint" style="margin-top:0">
        竖刀沿 Y 方向贯穿当前余料，横刀沿 X 方向贯穿；坐标为刀缝起点（原点在母纸左上角）。
        建议按张执行：第 1 张的全部刀完成后再开始下一张。
      </div>
      <div id="cuts_tables" style="overflow:auto"></div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let STATE = null;          // 服务端 /api/state
let dirty = false;         // 页面输入是否相对已保存输入有改动
const COLORS = ["#bcd3ec","#c9e4c5","#f3d9b1","#e6c6e2","#c6e4e0",
                "#f2c6c6","#d8dcc0","#cdc6e8","#f0e6b8","#bfe0ef",
                "#e2d3bd","#d6e8b8"];
const WASTE_COLOR = "#eee";

/* ---------- 成品行 ---------- */
function addProdRow(p){
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><input class="p-name" type="text" maxlength="40" value="${(p?.name)||""}"></td>
    <td><input class="p-l" type="number" min="1" step="1" value="${p?.l??100}" style="width:64px"></td>
    <td><input class="p-w" type="number" min="1" step="1" value="${p?.w??80}" style="width:64px"></td>
    <td><input class="p-qty" type="number" min="1" step="1" value="${p?.qty??10}" style="width:60px"></td>
    <td class="rot-cell"><input class="p-rot" type="checkbox" ${p?.rotatable===false?"":"checked"}></td>
    <td><button class="ghost p-del" type="button">删</button></td>`;
  tr.querySelector(".p-del").onclick = ()=>{ tr.remove(); markDirty(); };
  tr.querySelectorAll("input").forEach(i=>i.addEventListener("input", markDirty));
  $("prod_rows").appendChild(tr);
}
function readForm(){
  const rows = [...document.querySelectorAll("#prod_rows tr")];
  return {
    paper_l: Number($("paper_l").value),
    paper_w: Number($("paper_w").value),
    kerf: Number($("kerf").value),
    max_sheets: Number($("max_sheets").value),
    max_states: Number($("max_states").value),
    products: rows.map((tr,i)=>({
      name: tr.querySelector(".p-name").value.trim() || ("成品"+(i+1)),
      l: Number(tr.querySelector(".p-l").value),
      w: Number(tr.querySelector(".p-w").value),
      qty: Number(tr.querySelector(".p-qty").value),
      rotatable: tr.querySelector(".p-rot").checked,
    }))
  };
}
function fillForm(cfg){
  $("paper_l").value=cfg.paper_l; $("paper_w").value=cfg.paper_w;
  $("kerf").value=cfg.kerf; $("max_sheets").value=cfg.max_sheets;
  $("max_states").value=cfg.max_states;
  $("prod_rows").innerHTML="";
  cfg.products.forEach(addProdRow);
}
function markDirty(){ dirty=true; refreshButtons(); }
document.querySelectorAll("#paper_l,#paper_w,#kerf,#max_sheets,#max_states")
  .forEach(i=>i.addEventListener("input", markDirty));
$("btn_add").onclick = ()=>{ addProdRow(); markDirty(); };
// 首次进入默认提供两行成品
addProdRow({name:"",l:100,w:80,qty:10,rotatable:true});
addProdRow({name:"",l:60,w:60,qty:5,rotatable:true});

/* ---------- 提示 ---------- */
function banner(el, kind, html){
  el.className = "banner " + kind;
  el.innerHTML = html;
  el.style.display = html ? "block" : "none";
}
function refreshButtons(){
  const has = STATE && STATE.has_input;
  $("btn_solve").disabled = !has;
  const sol = STATE && STATE.solution;
  const exportable = has && sol && sol.fresh && sol.status==="found";
  $("btn_export").disabled = !exportable;
}

/* ---------- 服务端交互 ---------- */
async function loadState(){
  STATE = await (await fetch("/api/state")).json();
  if(STATE.has_input){
    fillForm(STATE.cfg);
    $("save_meta").textContent = "已保存输入版本：" + STATE.input_version +
      "（更新于 " + STATE.updated_at + " UTC）";
  }
  dirty = false;
  renderSolution();
  refreshButtons();
}

async function saveInputs(solveAfter){
  banner($("form_msg"),"","");
  const body = readForm();
  let r = await fetch("/api/inputs", {
    method:"PUT", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body)});
  const data = await r.json();
  if(!r.ok){
    banner($("form_msg"),"bad", "非法输入，未保存：" + (data.error||"") +
      (data.field? `（字段 ${data.field}）`:""));
    return false;
  }
  STATE = data.state; dirty=false;
  $("save_meta").textContent = "已保存输入版本：" + data.input_version;
  renderSolution(); refreshButtons();
  banner($("form_msg"),"ok", "输入已保存（非法输入不会被写入）。");
  if(solveAfter){ runSolve(); }
  return true;
}

async function runSolve(){
  $("btn_solve").disabled = true;
  banner($("form_msg"),"warn","正在搜索，请稍候……");
  try{
    const r = await fetch("/api/solve",{method:"POST"});
    const data = await r.json();
    if(!r.ok){
      banner($("form_msg"),"bad", data.error||"排样失败");
      return;
    }
    STATE = data.state;
    renderSolution(); refreshButtons();
    banner($("form_msg"),"","");
  }catch(e){
    banner($("form_msg"),"bad","请求失败："+e);
  }
}

$("btn_save").onclick = ()=>saveInputs(false);
$("btn_solve").onclick = ()=>saveInputs(true);
$("btn_export").onclick = ()=>{ window.location = "/api/export"; };

/* ---------- 结果渲染 ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function renderSolution(){
  const sol = STATE && STATE.solution;
  const badge=$("sol_badge"), meta=$("sol_meta"), sb=$("sol_banner");
  $("stale_note").style.display = (sol && !sol.fresh) ? "block":"none";
  if(!sol){
    badge.className="badge none"; badge.textContent="未排样";
    meta.textContent=""; banner(sb,"","");
    $("summary").innerHTML="";
    $("layout_card").style.display="none";
    $("cuts_card").style.display="none";
    return;
  }
  const st = sol.status;
  badge.className = "badge "+(st==="found"?"found":st);
  badge.textContent = st==="found" ? "找到可行方案"
    : st==="infeasible" ? "无解（已穷尽搜索）" : "搜索预算耗尽";
  meta.textContent = `方案版本 ${sol.input_version} · 搜索状态 ${sol.result.states_searched} · 生成于 ${sol.created_at} UTC`;

  if(!sol.fresh){
    banner(sb,"bad","该方案对应的是旧输入版本，已失效；导出被拒绝。请重新排样。");
  } else if(st==="found"){
    banner(sb,"ok",`已找到满足全部份数的可行排样（不保证最优）：实际使用 ${sol.result.sheets_used} 张母纸。`);
  } else if(st==="infeasible"){
    banner(sb,"bad","搜索已完整穷尽，在给定母纸尺寸、刀缝、张数上限与旋转限制下<b>不存在</b>可行排样。可放宽张数/尺寸/旋转后重试。");
  } else {
    banner(sb,"warn","搜索状态数预算耗尽，<b>不能据此声称无解</b>。请调大「搜索状态数上限」后重新排样。");
  }

  if(st!=="found"){
    $("summary").innerHTML="";
    $("layout_card").style.display="none";
    $("cuts_card").style.display="none";
    return;
  }
  renderSummary(sol.result);
  renderSheets(sol.result);
  renderCuts(sol.result);
  $("layout_card").style.display="block";
  $("cuts_card").style.display="block";
}

function renderSummary(res){
  const prods = STATE.cfg.products;
  const chips = prods.map((p,i)=>{
    const got=res.counts[i], ok=got>=p.qty;
    return `<span class="chip" style="${ok?"":"background:var(--badbg);color:var(--bad)"}">
      ${esc(p.name)} ${p.l}×${p.w}：需求 ${p.qty} / 实得 ${got}</span>`;
  }).join("");
  $("summary").innerHTML =
    `<div class="counts">${chips}</div>
     <div class="meta">实际成品总数 ${res.counts.reduce((a,b)=>a+b,0)}，
     使用母纸 ${res.sheets_used} / 上限 ${STATE.cfg.max_sheets} 张。</div>`;
}

/* ---------- SVG 排样图 ---------- */
function renderSheets(res){
  const {paper_l:L, paper_w:W, kerf:k} = STATE.cfg;
  const prods = STATE.cfg.products;
  // 等比缩放到最大宽 ~520
  const scale = Math.min(520/L, 4) ;
  const sw = L*scale, sh = W*scale;

  $("legend").innerHTML = prods.map((p,i)=>
    `<span><span class="sw" style="background:${COLORS[i%COLORS.length]}"></span>${esc(p.name)} ${p.l}×${p.w}</span>`
  ).join("") + `<span><span class="sw" style="background:${WASTE_COLOR}"></span>余料/废纸</span>
     <span>━━ 刀缝线（宽约 ${k} mm）</span>`;

  const bySheet = {};
  res.pieces.forEach(p=>(bySheet[p.sheet]=bySheet[p.sheet]||[]).push(p));
  const cutBySheet = {};
  res.cuts.forEach(c=>(cutBySheet[c.sheet]=cutBySheet[c.sheet]||[]).push(c));

  let html="";
  for(let si=0; si<res.sheets_used; si++){
    const pieces = bySheet[si]||[];
    const cuts = cutBySheet[si]||[];
    let s = `<svg class="paper" width="${sw+2}" height="${sh+2}" viewBox="-1 -1 ${L+2} ${W+2}">`;
    // 刀缝（先画带状，再画成品覆盖其上）
    cuts.forEach(c=>{
      if(c.orientation==="V"){
        s += `<rect x="${c.x}" y="${c.y}" width="${Math.max(k,0.8)}" height="${c.length}"
              fill="#5a3b3b" opacity="0.55"></rect>`;
      }else{
        s += `<rect x="${c.x}" y="${c.y}" width="${c.length}" height="${Math.max(k,0.8)}"
              fill="#5a3b3b" opacity="0.55"></rect>`;
      }
    });
    // 成品
    pieces.forEach(p=>{
      const i=p.product, color=COLORS[i%COLORS.length];
      const fs = Math.max(9, Math.min(p.w,p.h)*0.22*scale);
      s += `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}"
            fill="${color}" stroke="#2b3a4a" stroke-width="0.6"></rect>`;
      s += `<text x="${p.x+p.w/2}" y="${p.y+p.h/2}" text-anchor="middle"
            dominant-baseline="middle" font-size="${fs}" fill="#1c2733">${esc(prods[i].name)}</text>`;
      if(p.rotated)
        s += `<text x="${p.x+p.w-2}" y="${p.y+p.h-2}" text-anchor="end"
              font-size="${Math.max(7,fs*0.8)}" fill="#7a2f2f">旋</text>`;
    });
    s += `</svg>`;
    html += `<div class="sheet-block"><h3>第 ${si+1} 张母纸（${L}×${W} mm，
            ${pieces.length} 件成品，${cuts.length} 刀）</h3>
            <div class="sheet-wrap">${s}</div></div>`;
  }
  $("sheets").innerHTML = html;
}

/* ---------- 裁切步骤表 ---------- */
function renderCuts(res){
  const by = {};
  res.cuts.forEach(c=>(by[c.sheet]=by[c.sheet]||[]).push(c));
  let html="";
  for(let si=0; si<res.sheets_used; si++){
    const cuts = (by[si]||[]).slice().sort((a,b)=>a.order-b.order);
    html += `<h3 style="font-size:13px;margin:12px 0 4px">第 ${si+1} 张</h3>
      <table class="cuts"><thead><tr>
      <th>全局顺序</th><th>张内顺序</th><th>方向</th><th>x (mm)</th><th>y (mm)</th>
      <th>刀长 (mm)</th><th>说明</th></tr></thead><tbody>`;
    cuts.forEach(c=>{
      html += `<tr><td>${c.seq}</td><td>${c.order+1}</td>
        <td>${c.orientation==="V"?"竖刀 ↓":"横刀 →"}</td>
        <td>${c.x}</td><td>${c.y}</td><td>${c.length}</td>
        <td>${c.orientation==="V"?`x=${c.x} 处自上而下贯穿`:`y=${c.y} 处自左而右贯穿`}</td></tr>`;
    });
    html += "</tbody></table>";
  }
  $("cuts_tables").innerHTML = html;
}

/* 离开页面前若有未保存修改可提示（仅提示，不阻止） */
window.addEventListener("beforeunload", e=>{
  if(dirty){ e.preventDefault(); e.returnValue = ""; }
});

loadState();
</script>
</body>
</html>
